<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMSG 好き顔 TOP5 診断</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Noto+Sans+JP:wght@400;700&display=swap');

    :root {
      --gold-1: #ffe599;
      --gold-2: #c5a059;
      --gold-3: #8a6d3b;
      --bg-dark: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.9);
      --glass-border: rgba(197, 160, 89, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.2) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(100, 50, 255, 0.08) 0%, transparent 60%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景粒子 */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 40px 70px, #ffe599, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 160px 120px, #ffe599, rgba(0,0,0,0));
      background-size: 200px 200px;
      opacity: 0.3;
      animation: sparkle 20s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-200px); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, var(--gold-1) 50%, var(--gold-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    p.sub-title {
      font-size: 0.75rem;
      color: #aaaaaa;
      text-align: center;
      margin-bottom: 14px;
    }

    .phase-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 14px;
      box-shadow: 0 0 12px rgba(197, 160, 89, 0.4);
    }

    /* 対戦カード（スマホ最適化） */
    .vs-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card {
      flex: 1;
      background: rgba(10, 10, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 8px;
      overflow: hidden;
    }

    .card:active {
      transform: scale(0.97);
      border-color: var(--gold-2);
    }

    .card .img-box {
      width: 100%;
      height: 200px; /* 画像エリアを拡大 */
      background: #18181c;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center; /* 顔を中心に配置 */
    }

    .card .info-box {
      margin-top: 10px;
      margin-bottom: 4px;
      text-align: center;
      width: 100%;
    }

    .card .group {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--gold-2);
      display: block;
      margin-bottom: 2px;
    }

    .card .name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    /* ボタン */
    .action-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .action-btn {
      flex: 1;
      padding: 12px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(197, 160, 89, 0.3);
      border-color: var(--gold-2);
    }

    /* TOP5 結果 */
    .top5-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .top5-item {
      display: flex;
      align-items: center;
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 8px 12px;
      border-radius: 12px;
      gap: 12px;
    }

    .top5-rank {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold-1);
      width: 28px;
      text-align: center;
    }

    .top5-img-box {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--gold-2);
      background: #111;
      flex-shrink: 0;
    }

    .top5-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .top5-info {
      display: flex;
      flex-direction: column;
    }

    .top5-name {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
    }

    .top5-group {
      font-size: 0.7rem;
      color: var(--gold-2);
      font-weight: 700;
    }

    .hidden { display: none !important; }
    
    button.reset-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
      box-shadow: 0 5px 20px rgba(197, 160, 89, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BMSG 好き顔 TOP5</h1>
    <p class="sub-title">PRELIMINARY ➔ FINAL DIAGNOSIS</p>

    <!-- 診断画面 -->
    <div id="quiz-screen" style="text-align: center;">
      <span class="phase-badge" id="phase-badge">予選: BE:FIRST編</span>
      
      <div class="vs-container">
        <div id="card-a" class="card" onclick="selectMember('a')">
          <div class="img-box"><img id="img-a" src="" alt="" style="display:none;"></div>
          <div class="info-box">
            <span class="group" id="group-a">-</span>
            <span class="name" id="name-a">-</span>
          </div>
        </div>
        <div id="card-b" class="card" onclick="selectMember('b')">
          <div class="img-box"><img id="img-b" src="" alt="" style="display:none;"></div>
          <div class="info-box">
            <span class="group" id="group-b">-</span>
            <span class="name" id="name-b">-</span>
          </div>
        </div>
      </div>

      <div class="action-btns">
        <button class="action-btn" onclick="selectMember('both')">どちらも好き✨</button>
        <button class="action-btn" onclick="selectMember('skip')">パス / スキップ</button>
      </div>

      <p id="progress" style="font-size: 0.8rem; color: #888888; margin: 0; font-weight: 700;">MATCH: 0 / 0</p>
    </div>

    <!-- 結果画面（TOP5） -->
    <div id="result-screen" class="hidden">
      <h2 style="text-align: center; font-size: 1.2rem; color: #ffffff;">✨ YOUR TOP 5 MEMBERS ✨</h2>
      <div class="top5-list" id="top5-container"></div>
      <button class="reset-btn" onclick="startQuiz()">もう一度診断する</button>
    </div>
  </div>

  <script>
    const rawMembers = [
      // BE:FIRST (7)
      { name: "SOTA", group: "BE:FIRST", img: "sota.jpg" },
      { name: "SHUNTO", group: "BE:FIRST", img: "shunto.jpg" },
      { name: "MANATO", group: "BE:FIRST", img: "manato.jpg" },
      { name: "RYUHEI", group: "BE:FIRST", img: "ryuhei.jpg" },
      { name: "JUNON", group: "BE:FIRST", img: "junon.jpg" },
      { name: "RYOKI", group: "BE:FIRST", img: "ryoki.jpg" },
      { name: "LEO", group: "BE:FIRST", img: "leo.jpg" },
      // MAZZEL (8)
      { name: "KAIRYU", group: "MAZZEL", img: "kairyu.jpg" },
      { name: "NAOYA", group: "MAZZEL", img: "naoya.jpg" },
      { name: "RAN", group: "MAZZEL", img: "ran.jpg" },
      { name: "SEITO", group: "MAZZEL", img: "seito.jpg" },
      { name: "RYUKI", group: "MAZZEL", img: "ryuki.jpg" },
      { name: "TAKUTO", group: "MAZZEL", img: "takuto.jpg" },
      { name: "HAYATO", group: "MAZZEL", img: "hayato.jpg" },
      { name: "EIKI", group: "MAZZEL", img: "eiki.jpg" },
      // STARGLOW (5)
      { name: "RUI", group: "STARGLOW", img: "" },
      { name: "TAIKI", group: "STARGLOW", img: "" },
      { name: "KANON", group: "STARGLOW", img: "" },
      { name: "GOICHI", group: "STARGLOW", img: "" },
      { name: "ADAM", group: "STARGLOW", img: "" },
      // TRAINEE (20)
      { name: "YUTA", group: "TRAINEE", img: "" },
      { name: "KEI", group: "TRAINEE", img: "" },
      { name: "RAIKI", group: "TRAINEE", img: "" },
      { name: "TAICHI", group: "TRAINEE", img: "" },
      { name: "KANTA", group: "TRAINEE", img: "" },
      { name: "REN", group: "TRAINEE", img: "" },
      { name: "KAIRI", group: "TRAINEE", img: "" },
      { name: "KEITO", group: "TRAINEE", img: "" },
      { name: "COTA", group: "TRAINEE", img: "" },
      { name: "RYOMA", group: "TRAINEE", img: "" },
      { name: "AOI", group: "TRAINEE", img: "" },
      { name: "HAL", group: "TRAINEE", img: "" },
      { name: "YU", group: "TRAINEE", img: "" },
      { name: "KEISHIN", group: "TRAINEE", img: "" },
      { name: "RYOTO", group: "TRAINEE", img: "" },
      { name: "ISANA", group: "TRAINEE", img: "" },
      { name: "LEON", group: "TRAINEE", img: "" },
      { name: "KAITO", group: "TRAINEE", img: "" },
      { name: "TOMOKI", group: "TRAINEE", img: "" },
      { name: "REN.N", group: "TRAINEE", img: "" },
      { name: "YAMATO", group: "TRAINEE", img: "" },
      { name: "MITSUHIKO", group: "TRAINEE", img: "" },
      { name: "TERUHIKO", group: "TRAINEE", img: "" },
      // SOLO / BMSG (8)
      { name: "Novel Core", group: "SOLO", img: "" },
      { name: "Aile The Shota", group: "SOLO", img: "" },
      { name: "edhiii boi", group: "SOLO", img: "" },
      { name: "REIKO", group: "SOLO", img: "" },
      { name: "Ayumu Imazu", group: "SOLO", img: "" },
      { name: "banvox", group: "SOLO", img: "" },
      { name: "SALU", group: "SOLO", img: "" },
      { name: "SKY-HI", group: "BMSG", img: "" }
    ];

    const groups = ["BE:FIRST", "MAZZEL", "STARGLOW", "TRAINEE", "SOLO/BMSG"];
    let currentGroupIndex = 0;
    let currentPhase = "preliminary";
    let currentPool = [];
    let finalists = [];
    let pair = [];
    let matchCount = 0;
    let maxMatches = 0;
    const K = 32;

    function startQuiz() {
      currentGroupIndex = 0;
      currentPhase = "preliminary";
      finalists = [];
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      startGroupPreliminary();
    }

    function startGroupPreliminary() {
      const gName = groups[currentGroupIndex];
      document.getElementById("phase-badge").innerText = `予選: ${gName}編`;
      
      let filterGroup = gName === "SOLO/BMSG" ? ["SOLO", "BMSG"] : [gName];
      currentPool = rawMembers
        .filter(m => filterGroup.includes(m.group))
        .map(m => ({ ...m, rating: 1500 }));

      matchCount = 0;
      maxMatches = Math.min(Math.ceil(currentPool.length * 1.2), 8);
      nextMatch();
    }

    function startFinal() {
      currentPhase = "final";
      document.getElementById("phase-badge").innerText = `🔥 最終決定戦（ファイナル）`;
      
      currentPool = finalists.map(m => ({ ...m, rating: 1500 }));
      matchCount = 0;
      maxMatches = 10;
      nextMatch();
    }

    function nextMatch() {
      if (matchCount >= maxMatches) {
        if (currentPhase === "preliminary") {
          currentPool.sort((a, b) => b.rating - a.rating);
          const passCount = groups[currentGroupIndex] === "TRAINEE" ? 3 : 2;
          finalists.push(...currentPool.slice(0, passCount));

          currentGroupIndex++;
          if (currentGroupIndex < groups.length) {
            startGroupPreliminary();
          } else {
            startFinal();
          }
        } else {
          showResult();
        }
        return;
      }

      let idx1 = Math.floor(Math.random() * currentPool.length);
      let idx2;
      do {
        idx2 = Math.floor(Math.random() * currentPool.length);
      } while (idx1 === idx2);

      pair = [currentPool[idx1], currentPool[idx2]];

      setCardData('a', pair[0]);
      setCardData('b', pair[1]);

      matchCount++;
      document.getElementById("progress").innerText = `MATCH: ${matchCount} / ${maxMatches}`;
    }

    function setCardData(cardKey, member) {
      document.getElementById(`group-${cardKey}`).innerText = member.group;
      document.getElementById(`name-${cardKey}`).innerText = member.name;
      const imgElem = document.getElementById(`img-${cardKey}`);
      if (member.img) {
        imgElem.src = member.img;
        imgElem.style.display = 'block';
      } else {
        imgElem.style.display = 'none';
      }
    }

    function selectMember(action) {
      const p1 = pair[0];
      const p2 = pair[1];
      const Ra = p1.rating;
      const Rb = p2.rating;
      const Ea = 1 / (1 + Math.pow(10, (Rb - Ra) / 400));
      const Eb = 1 / (1 + Math.pow(10, (Ra - Rb) / 400));

      if (action === 'a') {
        p1.rating = Ra + K * (1 - Ea);
        p2.rating = Rb + K * (0 - Eb);
      } else if (action === 'b') {
        p1.rating = Ra + K * (0 - Ea);
        p2.rating = Rb + K * (1 - Eb);
      } else if (action === 'both') {
        p1.rating = Ra + K * (0.5 - Ea);
        p2.rating = Rb + K * (0.5 - Eb);
      }

      nextMatch();
    }

    function showResult() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      currentPool.sort((a, b) => b.rating - a.rating);
      const top5 = currentPool.slice(0, 5);

      const top5Container = document.getElementById("top5-container");
      top5Container.innerHTML = "";

      top5.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "top5-item";
        
        const imgHtml = item.img 
          ? `<img src="${item.img}" alt="${item.name}">` 
          : `<span style="font-size:0.65rem; color:#666; display:flex; align-items:center; justify-content:center; height:100%;">No Img</span>`;

        div.innerHTML = `
          <div class="top5-rank">#${index + 1}</div>
          <div class="top5-img-box">${imgHtml}</div>
          <div class="top5-info">
            <span class="top5-name">${item.name}</span>
            <span class="top5-group">${item.group}</span>
          </div>
        `;
        top5Container.appendChild(div);
      });
    }

    startQuiz();
  </script>
</body>
</html>
