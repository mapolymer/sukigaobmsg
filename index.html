<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMSG 好き顔 TOP5 診断</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Noto+Sans+JP:wght@400;700&display=swap');

    :root {
      --gold-1: #ffe599;
      --gold-2: #c5a059;
      --gold-3: #8a6d3b;
      --bg-dark: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.9);
      --glass-border: rgba(197, 160, 89, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.2) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(100, 50, 255, 0.08) 0%, transparent 60%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景粒子 */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 40px 70px, #ffe599, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 160px 120px, #ffe599, rgba(0,0,0,0));
      background-size: 200px 200px;
      opacity: 0.3;
      animation: sparkle 20s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-200px); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, var(--gold-1) 50%, var(--gold-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    p.sub-title {
      font-size: 0.75rem;
      color: #aaaaaa;
      text-align: center;
      margin-bottom: 14px;
    }

    .phase-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 14px;
      box-shadow: 0 0 12px rgba(197, 160, 89, 0.4);
    }

    .vs-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card {
      flex: 1;
      background: rgba(10, 10, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 8px;
      overflow: hidden;
    }

    .card:active {
      transform: scale(0.97);
      border-color: var(--gold-2);
    }

    .card .img-box {
      width: 100%;
      height: 200px;
      background: #18181c;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.75rem;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .card .info-box {
      margin-top: 10px;
      margin-bottom: 4px;
      text-align: center;
      width: 100%;
    }

    .card .group {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--gold-2);
      display: block;
      margin-bottom: 2px;
    }

    .card .name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    .action-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .action-btn {
      flex: 1;
      padding: 12px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(197, 160, 89, 0.3);
      border-color: var(--gold-2);
    }

    /* プログレスバーエリア */
    .progress-box {
      width: 100%;
      margin-top: 8px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #aaaaaa;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-2), var(--gold-1));
      border-radius: 10px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(255, 229, 153, 0.5);
    }

    /* TOP5 グリッドレイアウト */
    .top5-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .top5-card {
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .top5-card.rank-1 {
      grid-column: span 2;
      border-color: var(--gold-1);
      box-shadow: 0 0 15px rgba(255, 229, 153, 0.25);
      background: linear-gradient(180deg, rgba(35, 30, 20, 0.95) 0%, rgba(20, 20, 25, 0.95) 100%);
    }

    .top5-rank-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      z-index: 2;
    }

    .rank-1 .top5-rank-badge {
      background: linear-gradient(135deg, #ffffff, var(--gold-1));
      color: #000;
      font-size: 0.85rem;
    }

    .top5-img-box {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .rank-1 .top5-img-box {
      height: 200px;
    }

    .top5-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .top5-info {
      text-align: center;
      width: 100%;
    }

    .top5-group {
      font-size: 0.65rem;
      color: var(--gold-2);
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    .top5-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    .rank-1 .top5-name {
      font-size: 1.15rem;
    }

    .hidden { display: none !important; }
    
    .share-btn {
      width: 100%;
      padding: 14px;
      background: #000000;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }

    .share-btn:active {
      transform: scale(0.98);
      background: #111111;
    }

    button.reset-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #aaaaaa;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BMSG 好き顔 TOP5</h1>
    <p class="sub-title">PRELIMINARY ➔ FINAL DIAGNOSIS</p>

    <!-- 診断画面 -->
    <div id="quiz-screen" style="text-align: center;">
      <span class="phase-badge" id="phase-badge">🔥 予選：無差別ランダム総当たり</span>
      
      <div class="vs-container">
        <div id="card-a" class="card" onclick="selectMember('a')">
          <div class="img-box">
            <img id="img-a" src="" alt="" style="display:none;" onerror="this.style.display='none';">
          </div>
          <div class="info-box">
            <span class="group" id="group-a">-</span>
            <span class="name" id="name-a">-</span>
          </div>
        </div>
        <div id="card-b" class="card" onclick="selectMember('b')">
          <div class="img-box">
            <img id="img-b" src="" alt="" style="display:none;" onerror="this.style.display='none';">
          </div>
          <div class="info-box">
            <span class="group" id="group-b">-</span>
            <span class="name" id="name-b">-</span>
          </div>
        </div>
      </div>

      <div class="action-btns">
        <button class="action-btn" onclick="selectMember('both')">どちらも好き✨</button>
        <button class="action-btn" onclick="selectMember('skip')">パス / スキップ</button>
      </div>

      <!-- 進捗プログレスバー -->
      <div class="progress-box">
        <div class="progress-info">
          <span id="progress-text">第 1 問目</span>
          <span id="remaining-text">あと 30 問</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- 結果画面（TOP5） -->
    <div id="result-screen" class="hidden">
      <h2 style="text-align: center; font-size: 1.2rem; color: #ffffff;">✨ YOUR TOP 5 MEMBERS ✨</h2>
      <div class="top5-grid" id="top5-container"></div>
      
      <!-- Xでシェアボタン -->
      <button class="share-btn" onclick="shareToX()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        X (旧Twitter) で結果をシェア
      </button>

      <button class="reset-btn" onclick="startQuiz()">最初からやり直す</button>
    </div>
  </div>

  <script>
    const rawMembers = [
      // BE:FIRST (6名)
      { name: "SOTA", group: "BE:FIRST", img: "sota.jpg" },
      { name: "SHUNTO", group: "BE:FIRST", img: "shunto.jpg" },
      { name: "MANATO", group: "BE:FIRST", img: "manato.jpg" },
      { name: "RYUHEI", group: "BE:FIRST", img: "ryuhei.jpg" },
      { name: "JUNON", group: "BE:FIRST", img: "junon.jpg" },
      { name: "LEO", group: "BE:FIRST", img: "leo.jpg" },
      // MAZZEL (8名)
      { name: "KAIRYU", group: "MAZZEL", img: "kairyu.jpg" },
      { name: "NAOYA", group: "MAZZEL", img: "naoya.jpg" },
      { name: "RAN", group: "MAZZEL", img: "ran.jpg" },
      { name: "SEITO", group: "MAZZEL", img: "seito.jpg" },
      { name: "RYUKI", group: "MAZZEL", img: "ryuki.jpg" },
      { name: "TAKUTO", group: "MAZZEL", img: "takuto.jpg" },
      { name: "HAYATO", group: "MAZZEL", img: "hayato.jpg" },
      { name: "EIKI", group: "MAZZEL", img: "eiki.jpg" },
      // STARGLOW (5名)
      { name: "RUI", group: "STARGLOW", img: "rui.jpg" },
      { name: "TAIKI", group: "STARGLOW", img: "taiki.jpg" },
      { name: "KANON", group: "STARGLOW", img: "kanon.jpg" },
      { name: "GOICHI", group: "STARGLOW", img: "goichi.jpg" },
      { name: "ADAM", group: "STARGLOW", img: "adam.jpg" },
      // TRAINEE (23名)
      { name: "YUTA", group: "TRAINEE", img: "yuta.png" },
      { name: "KEI", group: "TRAINEE", img: "kei.png" },
      { name: "RAIKI", group: "TRAINEE", img: "raiki.png" },
      { name: "TAICHI", group: "TRAINEE", img: "taichi.png" },
      { name: "KANTA", group: "TRAINEE", img: "kanta.png" },
      { name: "REN", group: "TRAINEE", img: "ren.png" },
      { name: "KAIRI", group: "TRAINEE", img: "kairi.png" },
      { name: "KEITO", group: "TRAINEE", img: "keito.png" },
      { name: "COTA", group: "TRAINEE", img: "cota.png" },
      { name: "RYOMA", group: "TRAINEE", img: "ryoma.png" },
      { name: "AOI", group: "TRAINEE", img: "aoi.png" },
      { name: "HAL", group: "TRAINEE", img: "hal.png" },
      { name: "YU", group: "TRAINEE", img: "yu.png" },
      { name: "KEISHIN", group: "TRAINEE", img: "keishin.png" },
      { name: "RYOTO", group: "TRAINEE", img: "ryoto.png" },
      { name: "ISANA", group: "TRAINEE", img: "isana.png" },
      { name: "LEON", group: "TRAINEE", img: "leon.png" },
      { name: "KAITO", group: "TRAINEE", img: "kaito.png" },
      { name: "TOMOKI", group: "TRAINEE", img: "tomoki.png" },
      { name: "REN.N", group: "TRAINEE", img: "ren-n.png" },
      { name: "YAMATO", group: "TRAINEE", img: "yamato.png" },
      { name: "MITSUHIKO", group: "TRAINEE", img: "mitsuhiko.png" },
      { name: "TERUHIKO", group: "TRAINEE", img: "teruhiko.png" },
      // SOLO / BMSG (8名)
      { name: "Novel Core", group: "SOLO", img: "novelcore.jpg" },
      { name: "Aile The Shota", group: "SOLO", img: "ailetheshota.jpg" },
      { name: "edhiii boi", group: "SOLO", img: "edhiiiboi.jpg" },
      { name: "REIKO", group: "SOLO", img: "reiko.jpg" },
      { name: "Ayumu Imazu", group: "SOLO", img: "ayumuimazu.jpg" },
      { name: "banvox", group: "SOLO", img: "banvox.jpg" },
      { name: "SALU", group: "SOLO", img: "salu.png" },
      { name: "SKY-HI", group: "BMSG", img: "skyhi.jpg" }
    ];

    let currentPhase = "preliminary"; 
    let pool = [];
    let pair = [];
    let matchCount = 0;
    let maxMatches = 30;
    let top5Result = [];
    const K = 32;

    function startQuiz() {
      currentPhase = "preliminary";
      matchCount = 0;
      maxMatches = 30;
      pool = rawMembers.map(m => ({ ...m, rating: 1500 }));
      
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("phase-badge").innerText = "🔥 予選：無差別ランダム総当たり";
      
      nextMatch();
    }

    function startFinal() {
      currentPhase = "final";
      matchCount = 0;
      maxMatches = 10; 

      pool.sort((a, b) => b.rating - a.rating);
      pool = pool.slice(0, 8).map(m => ({ ...m, rating: 1500 }));

      document.getElementById("phase-badge").innerText = "✨ 本選：予選上位8名による最終選抜";
      nextMatch();
    }

    function nextMatch() {
      if (matchCount >= maxMatches) {
        if (currentPhase === "preliminary") {
          startFinal();
        } else {
          showResult();
        }
        return;
      }

      let idx1 = Math.floor(Math.random() * pool.length);
      let idx2;
      do {
        idx2 = Math.floor(Math.random() * pool.length);
      } while (idx1 === idx2);

      pair = [pool[idx1], pool[idx2]];

      setCardData('a', pair[0]);
      setCardData('b', pair[1]);

      matchCount++;
      updateProgressBar();
    }

    function updateProgressBar() {
      const currentQ = matchCount;
      const remainingQ = maxMatches - matchCount;
      const percent = (currentQ / maxMatches) * 100;

      document.getElementById("progress-text").innerText = `第 ${currentQ} 問目`;
      document.getElementById("remaining-text").innerText = `あと ${remainingQ} 問`;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;
    }

    function setCardData(cardKey, member) {
      document.getElementById(`group-${cardKey}`).innerText = member.group;
      document.getElementById(`name-${cardKey}`).innerText = member.name;
      const imgElem = document.getElementById(`img-${cardKey}`);
      if (member.img) {
        imgElem.src = member.img;
        imgElem.style.display = 'block';
      } else {
        imgElem.style.display = 'none';
      }
    }

    function selectMember(action) {
      const p1 = pair[0];
      const p2 = pair[1];
      const Ra = p1.rating;
      const Rb = p2.rating;
      const Ea = 1 / (1 + Math.pow(10, (Rb - Ra) / 400));
      const Eb = 1 / (1 + Math.pow(10, (Ra - Rb) / 400));

      if (action === 'a') {
        p1.rating = Ra + K * (1 - Ea);
        p2.rating = Rb + K * (0 - Eb);
      } else if (action === 'b') {
        p1.rating = Ra + K * (0 - Ea);
        p2.rating = Rb + K * (1 - Eb);
      } else if (action === 'both') {
        p1.rating = Ra + K * (0.5 - Ea);
        p2.rating = Rb + K * (0.5 - Eb);
      }

      nextMatch();
    }

    function showResult() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      pool.sort((a, b) => b.rating - a.rating);
      top5Result = pool.slice(0, 5);

      const top5Container = document.getElementById("top5-container");
      top5Container.innerHTML = "";

      top5Result.forEach((item, index) => {
        const div = document.createElement("div");
        const rankNum = index + 1;
        div.className = `top5-card ${rankNum === 1 ? 'rank-1' : ''}`;
        
        const imgHtml = item.img 
          ? `<img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">` 
          : `<span style="font-size:0.65rem; color:#666;">No Img</span>`;

        div.innerHTML = `
          <div class="top5-rank-badge">#${rankNum}</div>
          <div class="top5-img-box">${imgHtml}</div>
          <div class="top5-info">
            <span class="top5-group">${item.group}</span>
            <span class="top5-name">${item.name}</span>
          </div>
        `;
        top5Container.appendChild(div);
      });
    }

    function shareToX() {
      if (top5Result.length === 0) return;

      const text = `✨私のBMSG 好き顔 TOP5✨\n\n` +
        `1位：${top5Result[0].name} (${top5Result[0].group})\n` +
        `2位：${top5Result[1].name} (${top5Result[1].group})\n` +
        `3位：${top5Result[2].name} (${top5Result[2].group})\n` +
        `4位：${top5Result[3].name} (${top5Result[3].group})\n` +
        `5位：${top5Result[4].name} (${top5Result[4].group})\n\n` +
        `#BMSG好き顔診断 #BMSG`;

      const shareUrl = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
      window.open(shareUrl, '_blank');
    }

    startQuiz();
  </script>
</body>
</html>
